<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OFFLINE CHAT - Private Conversation</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-surface: rgba(11, 19, 43, 0.8);
      --bg-surface-elevated: rgba(15, 23, 42, 0.95);
      --bg-input: rgba(15, 23, 42, 0.75);
      --border-subtle: rgba(56, 189, 248, 0.16);
      --border-glow: rgba(0, 242, 254, 0.35);
      --border-focus: #00f2fe;
      --electric-blue: #0066ff;
      --cyan: #00f2fe;
      --neon-teal: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #0066ff 100%);
      --msg-outgoing: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
      --msg-incoming: rgba(15, 23, 42, 0.88);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --status-online: #10b981;
      --status-offline: #f59e0b;
      --status-syncing: #38bdf8;
      --danger: #ef4444;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-header: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-stack);
      height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Light */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.25;
      will-change: transform;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .ambient-orb-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #0052cc 0%, transparent 70%);
      top: -60px;
      left: -80px;
    }

    .ambient-orb-2 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00f2fe 0%, transparent 70%);
      bottom: -60px;
      right: -80px;
      animation-delay: -7s;
    }

    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(20px, 20px, 0) scale(1.06); }
    }

    /* Mobile Chat Shell */
    .chat-app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(3, 7, 18, 0.6);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* Chat Header */
    .chat-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(7, 12, 28, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-header);
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .btn-icon-nav {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-icon-nav:active {
      transform: scale(0.92);
      border-color: var(--cyan);
    }

    .btn-icon-nav svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .chat-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #030712;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .avatar-status-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--status-offline);
      border: 2px solid #070c1c;
      transition: background 0.3s;
    }

    .avatar-status-dot.online {
      background: var(--status-online);
      box-shadow: 0 0 6px var(--status-online);
    }

    .header-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .header-name {
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .header-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-public-id {
      color: var(--cyan);
      font-family: monospace;
      font-size: 0.7rem;
    }

    .network-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 600;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .network-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .network-chip.online .dot {
      background: var(--status-online);
      box-shadow: 0 0 6px var(--status-online);
    }

    .network-chip.offline {
      border-color: rgba(245, 158, 11, 0.35);
    }

    .network-chip.offline .dot {
      background: var(--status-offline);
      box-shadow: 0 0 6px var(--status-offline);
    }

    .network-chip.syncing .dot {
      background: var(--status-syncing);
      box-shadow: 0 0 6px var(--status-syncing);
    }

    /* Sync & Offline Status Notification Strip */
    .status-strip {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 14px;
      font-size: 0.74rem;
      line-height: 1.3;
      text-align: center;
      backdrop-filter: blur(10px);
      z-index: 15;
      transition: all 0.3s ease;
    }

    .status-strip.show {
      display: flex;
    }

    .status-strip.offline {
      background: rgba(245, 158, 11, 0.14);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    .status-strip.syncing {
      background: rgba(56, 189, 248, 0.14);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    /* Message Stream Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* Date Separator Pill */
    .date-separator {
      align-self: center;
      margin: 8px 0;
      padding: 4px 12px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.14);
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeInBubble 0.22s ease-out;
    }

    @keyframes fadeInBubble {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.outgoing {
      align-items: flex-end;
    }

    .message-row.incoming {
      align-items: flex-start;
    }

    .message-bubble {
      max-width: 82%;
      padding: 10px 14px;
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: 0.91rem;
      line-height: 1.45;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .message-row.outgoing .message-bubble {
      background: var(--msg-outgoing);
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .message-row.incoming .message-bubble {
      background: var(--msg-incoming);
      color: #f1f5f9;
      border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--border-subtle);
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 4px;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.65);
    }

    .message-row.incoming .message-meta {
      color: var(--text-subtle);
    }

    /* Status Tick Icons */
    .status-tick {
      display: inline-flex;
      align-items: center;
    }

    .status-tick svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .status-tick.pending {
      color: #f59e0b;
    }

    .status-tick.sent {
      color: rgba(255, 255, 255, 0.7);
    }

    .status-tick.delivered {
      color: #cbd5e1;
    }

    .status-tick.read {
      color: var(--cyan);
    }

    /* Chat Empty State */
    .chat-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      gap: 10px;
    }

    .chat-empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid var(--border-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }

    .chat-empty-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .chat-empty-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff;
    }

    .chat-empty-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      max-width: 260px;
      line-height: 1.4;
    }

    /* Chat Input Bar */
    .chat-input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(7, 12, 28, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      z-index: 20;
    }

    .input-field-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 4px 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field-wrapper:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
    }

    .chat-textarea {
      width: 100%;
      max-height: 120px;
      min-height: 38px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.92rem;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
      padding: 8px 0;
    }

    .chat-textarea::placeholder {
      color: var(--text-subtle);
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #030712;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 242, 254, 0.3);
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-send:active {
      transform: scale(0.92);
    }

    .btn-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-send svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      margin-left: 2px;
    }

    /* Modal / Error Screen */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .fullscreen-modal.hidden {
      display: none;
    }

    .modal-error-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      margin-bottom: 16px;
    }

    .modal-error-icon svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .btn-modal-action {
      background: var(--accent-gradient);
      color: #030712;
      border: none;
      padding: 12px 26px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    /* Loading Overlay */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 150;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 242, 254, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Options Drawer Modal */
    .drawer-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 80;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-modal.show {
      display: flex;
    }

    .drawer-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface-elevated);
      border-top: 1px solid var(--border-glow);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.8);
      animation: slideUpDrawer 0.25s ease-out;
    }

    @keyframes slideUpDrawer {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .drawer-item:active {
      background: rgba(0, 242, 254, 0.12);
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .ambient-orb,
      .spinner,
      .message-row {
        animation: none !important;
      }
      .chat-messages {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effects -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
  </div>

  <!-- Loading Verification Overlay -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <p style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Securing private conversation...</p>
  </div>

  <!-- Authorization / Error Screen -->
  <div class="fullscreen-modal hidden" id="errorModal">
    <div class="modal-error-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    </div>
    <h2 class="modal-title" id="errorModalTitle">Access Denied</h2>
    <p class="modal-desc" id="errorModalDesc">You are not authorized to view this conversation or the recipient is not in your friends list.</p>
    <a href="home.html" class="btn-modal-action">Return to Dashboard</a>
  </div>

  <!-- Chat Shell -->
  <div class="chat-app-shell">

    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <button type="button" class="btn-icon-nav" id="btnBackToHome" aria-label="Back to conversations">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <div class="chat-avatar-wrapper">
          <div class="chat-avatar" id="friendAvatar">?</div>
          <span class="avatar-status-dot" id="friendOnlineDot"></span>
        </div>

        <div class="header-info">
          <span class="header-name" id="friendUsername">Loading...</span>
          <div class="header-sub">
            <span class="header-public-id" id="friendPublicId">u_------</span>
            <span style="font-size: 0.6rem; opacity: 0.5;">•</span>
            <span id="friendStatusLabel">Offline</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="network-chip online" id="connectionChip">
          <span class="dot"></span>
          <span id="connectionChipText">Online</span>
        </div>

        <button type="button" class="btn-icon-nav" id="btnOpenOptions" aria-label="Conversation options">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </button>
      </div>
    </header>

    <!-- Synchronizing / Offline Notice Strip -->
    <div class="status-strip" id="statusStrip">
      <span id="statusStripText">Notice text</span>
    </div>

    <!-- Message History Stream -->
    <main class="chat-messages" id="messagesContainer">
      <!-- Dynamic Messages rendered here -->
    </main>

    <!-- Input Bar -->
    <footer class="chat-input-bar">
      <div class="input-field-wrapper">
        <textarea
          id="messageInput"
          class="chat-textarea"
          rows="1"
          placeholder="Type a message..."
          maxlength="2000"
          spellcheck="true"
        ></textarea>
      </div>

      <button type="button" class="btn-send" id="btnSendMessage" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </footer>

  </div>

  <!-- Options Drawer Modal -->
  <div class="drawer-modal" id="optionsDrawer">
    <div class="drawer-card">
      <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 2px;">Conversation Options</div>
      <button type="button" class="drawer-item" id="btnCopyFriendId">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>Copy Friend's Public ID</span>
      </button>
      <button type="button" class="drawer-item" id="btnSyncNow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <span>Force Offline Queue Sync</span>
      </button>
      <button type="button" class="drawer-item" id="btnCloseDrawer" style="justify-content: center; color: var(--text-muted); font-weight: 600; margin-top: 4px;">
        Close
      </button>
    </div>
  </div>

  <!-- Firebase Modular SDK & Application Core -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      update,
      query,
      orderByChild,
      limitToLast,
      onChildAdded,
      onValue,
      off,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    /* =====================================================================
       FIREBASE CONFIGURATION
       ===================================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyArWgFK0UKGcmBBhxmRs04lxnTENKtnqO8",
      authDomain: "mymessenger-654cc.firebaseapp.com",
      databaseURL: "https://mymessenger-654cc-default-rtdb.firebaseio.com",
      projectId: "mymessenger-654cc",
      storageBucket: "mymessenger-654cc.firebasestorage.app",
      messagingSenderId: "235567629524",
      appId: "1:235567629524:web:048490b12ed6eb25b26741"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getDatabase(app);

    /* =====================================================================
       INDEXEDDB PERSISTENCE (CACHED MESSAGES & OFFLINE QUEUE)
       ===================================================================== */
    const IDB_NAME = "OfflineChatDB";
    const IDB_VERSION = 2;
    const MSG_STORE = "cachedMessages";
    const PENDING_STORE = "pendingMessages";

    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const idb = e.target.result;
          if (!idb.objectStoreNames.contains("userCache")) {
            idb.createObjectStore("userCache");
          }
          if (!idb.objectStoreNames.contains(MSG_STORE)) {
            const msgStore = idb.createObjectStore(MSG_STORE, { keyPath: "clientMessageId" });
            msgStore.createIndex("conversationId", "conversationId", { unique: false });
            msgStore.createIndex("createdAt", "createdAt", { unique: false });
          }
          if (!idb.objectStoreNames.contains(PENDING_STORE)) {
            const pendingStore = idb.createObjectStore(PENDING_STORE, { keyPath: "clientMessageId" });
            pendingStore.createIndex("conversationId", "conversationId", { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbSaveMessage(msg) {
      try {
        const idb = await openIDB();
        const tx = idb.transaction(MSG_STORE, "readwrite");
        tx.objectStore(MSG_STORE).put(msg);
      } catch (err) {
        console.warn("IDB Save message warn:", err);
      }
    }

    async function idbGetMessagesForConversation(convId) {
      try {
        const idb = await openIDB();
        return new Promise((resolve) => {
          const tx = idb.transaction(MSG_STORE, "readonly");
          const index = tx.objectStore(MSG_STORE).index("conversationId");
          const req = index.getAll(convId);
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch {
        return [];
      }
    }

    async function idbSavePending(msg) {
      try {
        const idb = await openIDB();
        const tx = idb.transaction([MSG_STORE, PENDING_STORE], "readwrite");
        tx.objectStore(MSG_STORE).put(msg);
        tx.objectStore(PENDING_STORE).put(msg);
      } catch (err) {
        console.warn("IDB Save pending warn:", err);
      }
    }

    async function idbRemovePending(clientMessageId) {
      try {
        const idb = await openIDB();
        const tx = idb.transaction(PENDING_STORE, "readwrite");
        tx.objectStore(PENDING_STORE).delete(clientMessageId);
      } catch (err) {
        console.warn("IDB Remove pending warn:", err);
      }
    }

    async function idbGetPendingForConversation(convId) {
      try {
        const idb = await openIDB();
        return new Promise((resolve) => {
          const tx = idb.transaction(PENDING_STORE, "readonly");
          const index = tx.objectStore(PENDING_STORE).index("conversationId");
          const req = index.getAll(convId);
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch {
        return [];
      }
    }

    /* =====================================================================
       APP STATE & URL PARAMETERS
       ===================================================================== */
    const urlParams = new URLSearchParams(window.location.search);
    const friendUid = urlParams.get('uid');

    let currentUser = null;
    let currentUserProfile = null;
    let friendProfile = null;
    let conversationId = null;

    let activeFirebaseListeners = [];
    let isSynchronizing = false;
    let displayedMessageIds = new Set();
    let currentRenderedDates = new Set();

    // DOM References
    const loadingScreen = document.getElementById('loadingScreen');
    const errorModal = document.getElementById('errorModal');
    const errorModalTitle = document.getElementById('errorModalTitle');
    const errorModalDesc = document.getElementById('errorModalDesc');

    const btnBackToHome = document.getElementById('btnBackToHome');
    const friendAvatar = document.getElementById('friendAvatar');
    const friendUsername = document.getElementById('friendUsername');
    const friendPublicId = document.getElementById('friendPublicId');
    const friendOnlineDot = document.getElementById('friendOnlineDot');
    const friendStatusLabel = document.getElementById('friendStatusLabel');

    const connectionChip = document.getElementById('connectionChip');
    const connectionChipText = document.getElementById('connectionChipText');
    const statusStrip = document.getElementById('statusStrip');
    const statusStripText = document.getElementById('statusStripText');

    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const btnSendMessage = document.getElementById('btnSendMessage');

    const optionsDrawer = document.getElementById('optionsDrawer');
    const btnOpenOptions = document.getElementById('btnOpenOptions');
    const btnCloseDrawer = document.getElementById('btnCloseDrawer');
    const btnCopyFriendId = document.getElementById('btnCopyFriendId');
    const btnSyncNow = document.getElementById('btnSyncNow');

    /* =====================================================================
       HELPERS & FORMATTERS
       ===================================================================== */
    function getInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateSeparator(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) return 'Today';
      
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';

      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function generateClientMessageId() {
      const rand = Math.random().toString(36).substring(2, 9);
      return `msg_${Date.now()}_${rand}`;
    }

    function getDeterministicConversationId(uidA, uidB) {
      return [uidA, uidB].sort().join('_');
    }

    function scrollMessagesToBottom(force = false) {
      const isNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 140;
      if (force || isNearBottom) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }

    /* =====================================================================
       NETWORK MONITORING & CONNECTION BANNER
       ===================================================================== */
    function updateNetworkStatus(online) {
      if (online) {
        connectionChip.className = 'network-chip online';
        connectionChipText.textContent = 'Online';
        statusStrip.classList.remove('show', 'offline');
        
        // Auto-trigger sync when network reconnects
        if (conversationId) {
          syncPendingMessages();
        }
      } else {
        connectionChip.className = 'network-chip offline';
        connectionChipText.textContent = 'Offline';
        statusStrip.className = 'status-strip show offline';
        statusStripText.textContent = 'You are offline. New messages will be saved on this device and synchronized when your connection returns.';
      }
    }

    window.addEventListener('online', () => updateNetworkStatus(true));
    window.addEventListener('offline', () => updateNetworkStatus(false));
    updateNetworkStatus(navigator.onLine);

    /* =====================================================================
       AUTHENTICATION & FRIENDSHIP AUTHORIZATION VERIFICATION
       ===================================================================== */
    btnBackToHome.addEventListener('click', () => {
      window.location.href = "home.html";
    });

    function displayAccessError(title, message) {
      loadingScreen.classList.add('hidden');
      errorModalTitle.textContent = title;
      errorModalDesc.textContent = message;
      errorModal.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "auth.html?mode=login";
        return;
      }

      currentUser = user;

      // 1. Validate friend UID parameter
      if (!friendUid || friendUid.trim() === "" || friendUid === user.uid) {
        displayAccessError("Invalid Conversation", "A valid recipient Firebase UID was not specified.");
        return;
      }

      // 2. Establish deterministic conversation ID
      conversationId = getDeterministicConversationId(user.uid, friendUid);

      // 3. Load user's profile and check friendship
      try {
        const userProfileSnap = await get(ref(db, `users/${user.uid}`));
        if (userProfileSnap.exists()) {
          currentUserProfile = userProfileSnap.val();
        } else {
          currentUserProfile = { uid: user.uid, username: user.displayName || 'Me' };
        }

        // Verify mutual friendship from DB
        const friendRecordSnap = await get(ref(db, `friends/${user.uid}/${friendUid}`));
        if (!friendRecordSnap.exists()) {
          // If offline, check if we have cached messages as fallback authorization
          const cachedOfflineMsgs = await idbGetMessagesForConversation(conversationId);
          if (cachedOfflineMsgs.length === 0 && !navigator.onLine) {
            displayAccessError("Friendship Not Verified", "Cannot verify friendship authorization while offline.");
            return;
          } else if (!friendRecordSnap.exists() && navigator.onLine) {
            displayAccessError("Not Friends", "You and this user must be mutual friends before starting a conversation.");
            return;
          }
        }

        // 4. Fetch friend profile
        const friendSnap = await get(ref(db, `users/${friendUid}`));
        if (friendSnap.exists()) {
          friendProfile = friendSnap.val();
          renderFriendHeader(friendProfile);
        } else {
          const fallbackData = friendRecordSnap.exists() ? friendRecordSnap.val() : {};
          friendProfile = {
            uid: friendUid,
            username: fallbackData.username || "Friend",
            publicId: fallbackData.publicId || "u_------"
          };
          renderFriendHeader(friendProfile);
        }

      } catch (err) {
        console.warn("Authorization verification offline warning:", err);
        // Offline graceful fallback
        const cachedOfflineMsgs = await idbGetMessagesForConversation(conversationId);
        if (cachedOfflineMsgs.length > 0) {
          renderFriendHeader({ uid: friendUid, username: "Friend", publicId: "u_------" });
        } else {
          displayAccessError("Connection Error", "Could not verify permissions. Please check your network connection.");
          return;
        }
      }

      // 5. Load Cached History & Subscribe to Realtime Updates
      await loadCachedMessagesFirst();
      setupConversationListeners();
      loadingScreen.classList.add('hidden');

      // 6. Attempt initial sync of pending messages if online
      if (navigator.onLine) {
        syncPendingMessages();
      }
    });

    function renderFriendHeader(profile) {
      const name = profile.username || "Friend";
      const pubId = profile.publicId || "u_------";

      friendUsername.textContent = name;
      friendPublicId.textContent = pubId;
      friendAvatar.textContent = getInitials(name);

      if (profile.isOnline) {
        friendOnlineDot.className = "avatar-status-dot online";
        friendStatusLabel.textContent = "Online";
      } else {
        friendOnlineDot.className = "avatar-status-dot";
        friendStatusLabel.textContent = "Offline";
      }
    }

    /* =====================================================================
       MESSAGE RENDERING & DOM BUILDERS
       ===================================================================== */
    function renderDateSeparatorIfNeeded(timestamp) {
      if (!timestamp) return;
      const dateKey = new Date(timestamp).toDateString();
      if (!currentRenderedDates.has(dateKey)) {
        currentRenderedDates.add(dateKey);
        const sep = document.createElement('div');
        sep.className = 'date-separator';
        sep.textContent = formatDateSeparator(timestamp);
        messagesContainer.appendChild(sep);
      }
    }

    function renderMessageBubble(msg, prepend = false) {
      if (displayedMessageIds.has(msg.clientMessageId)) {
        // Update existing element status if changed
        const existingRow = document.getElementById(msg.clientMessageId);
        if (existingRow) {
          updateMessageStatusBadge(existingRow, msg.status);
        }
        return;
      }

      displayedMessageIds.add(msg.clientMessageId);

      // Ensure empty state is cleared
      const emptyState = document.getElementById('chatEmptyState');
      if (emptyState) emptyState.remove();

      renderDateSeparatorIfNeeded(msg.createdAt);

      const isOutgoing = msg.senderUid === currentUser.uid;
      const row = document.createElement('div');
      row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
      row.id = msg.clientMessageId;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      
      // Safe text rendering prevents XSS
      const textSpan = document.createElement('span');
      textSpan.textContent = msg.text;
      bubble.appendChild(textSpan);

      const meta = document.createElement('div');
      meta.className = 'message-meta';

      const timeSpan = document.createElement('span');
      timeSpan.textContent = formatTime(msg.createdAt);
      meta.appendChild(timeSpan);

      if (isOutgoing) {
        const tickSpan = document.createElement('span');
        tickSpan.className = `status-tick ${msg.status || 'pending'}`;
        tickSpan.innerHTML = getStatusIconSvg(msg.status || 'pending');
        meta.appendChild(tickSpan);
      }

      bubble.appendChild(meta);
      row.appendChild(bubble);

      if (prepend) {
        messagesContainer.prepend(row);
      } else {
        messagesContainer.appendChild(row);
      }
    }

    function updateMessageStatusBadge(rowElement, status) {
      const tick = rowElement.querySelector('.status-tick');
      if (tick) {
        tick.className = `status-tick ${status || 'pending'}`;
        tick.innerHTML = getStatusIconSvg(status || 'pending');
      }
    }

    function getStatusIconSvg(status) {
      if (status === 'pending') {
        // Clock Icon
        return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
      } else if (status === 'sent') {
        // Single Check
        return `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else if (status === 'delivered') {
        // Double Check
        return `<svg viewBox="0 0 24 24"><polyline points="18 6 7 17 2 12"></polyline><polyline points="22 10 13 19 11 17"></polyline></svg>`;
      } else if (status === 'read') {
        // Cyan Double Check
        return `<svg viewBox="0 0 24 24"><polyline points="18 6 7 17 2 12"></polyline><polyline points="22 10 13 19 11 17"></polyline></svg>`;
      }
      return '';
    }

    function showEmptyState() {
      if (displayedMessageIds.size === 0) {
        messagesContainer.innerHTML = `
          <div class="chat-empty-state" id="chatEmptyState">
            <div class="chat-empty-icon">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <div class="chat-empty-title">Start your conversation</div>
            <div class="chat-empty-sub">Say hello! Messages written while offline are saved securely and synchronized automatically.</div>
          </div>
        `;
      }
    }

    /* =====================================================================
       LOAD CACHED MESSAGES & FIREBASE REALTIME LISTENERS
       ===================================================================== */
    async function loadCachedMessagesFirst() {
      const cached = await idbGetMessagesForConversation(conversationId);
      if (cached && cached.length > 0) {
        cached.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        cached.forEach(msg => renderMessageBubble(msg));
        scrollMessagesToBottom(true);
      } else {
        showEmptyState();
      }
    }

    function setupConversationListeners() {
      detachAllListeners();

      const messagesRef = ref(db, `conversations/${conversationId}/messages`);
      const recentQuery = query(messagesRef, orderByChild('createdAt'), limitToLast(60));

      const childAddedListener = onChildAdded(recentQuery, async (snap) => {
        const remoteMsg = snap.val();
        if (!remoteMsg) return;

        // Save into IndexedDB cache
        await idbSaveMessage(remoteMsg);

        // If this message was in our pending queue, remove it from pending store
        await idbRemovePending(remoteMsg.clientMessageId);

        renderMessageBubble(remoteMsg);
        scrollMessagesToBottom();
      }, (err) => {
        console.warn("RTDB Message listener offline or permissions issue:", err);
      });

      activeFirebaseListeners.push({ ref: messagesRef, listener: childAddedListener });

      // Friend Online Presence Listener
      const friendPresenceRef = ref(db, `users/${friendUid}/isOnline`);
      const presenceListener = onValue(friendPresenceRef, (snap) => {
        const isOnline = snap.val() === true;
        friendOnlineDot.className = isOnline ? "avatar-status-dot online" : "avatar-status-dot";
        friendStatusLabel.textContent = isOnline ? "Online" : "Offline";
      });
      activeFirebaseListeners.push({ ref: friendPresenceRef, listener: presenceListener });
    }

    function detachAllListeners() {
      activeFirebaseListeners.forEach(({ ref: r }) => off(r));
      activeFirebaseListeners = [];
    }

    window.addEventListener('beforeunload', () => {
      detachAllListeners();
    });

    /* =====================================================================
       SENDING MESSAGES & GENUINE OFFLINE PERSISTENCE
       ===================================================================== */
    messageInput.addEventListener('input', () => {
      btnSendMessage.disabled = messageInput.value.trim().length === 0;
      // Auto-grow textarea
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!btnSendMessage.disabled) {
          handleSendMessage();
        }
      }
    });

    btnSendMessage.addEventListener('click', (e) => {
      e.preventDefault();
      handleSendMessage();
    });

    async function handleSendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser || !conversationId) return;

      const clientMessageId = generateClientMessageId();
      const localTimestamp = Date.now();

      // Reset Input
      messageInput.value = '';
      messageInput.style.height = 'auto';
      btnSendMessage.disabled = true;

      const messageObj = {
        clientMessageId: clientMessageId,
        conversationId: conversationId,
        senderUid: currentUser.uid,
        receiverUid: friendUid,
        text: text,
        createdAt: localTimestamp,
        status: navigator.onLine ? 'sent' : 'pending'
      };

      if (!navigator.onLine) {
        // True Offline Path: Save to local IndexedDB pending queue
        messageObj.status = 'pending';
        await idbSavePending(messageObj);
        renderMessageBubble(messageObj);
        scrollMessagesToBottom(true);
      } else {
        // Optimistic Local Display + Remote Firebase Write
        renderMessageBubble(messageObj);
        scrollMessagesToBottom(true);
        await idbSaveMessage(messageObj);

        try {
          const msgRef = ref(db, `conversations/${conversationId}/messages/${clientMessageId}`);
          await set(msgRef, {
            ...messageObj,
            createdAt: serverTimestamp(),
            status: 'sent'
          });

          // Update recent conversation preview for both participants
          const recentChatPayload = {
            friendUid: friendUid,
            friendUsername: friendProfile?.username || 'Friend',
            friendPublicId: friendProfile?.publicId || '',
            lastMessage: text,
            timestamp: serverTimestamp(),
            unreadCount: 0
          };
          update(ref(db, `recentChats/${currentUser.uid}/${friendUid}`), recentChatPayload).catch(() => {});

          const recipientRecentPayload = {
            friendUid: currentUser.uid,
            friendUsername: currentUserProfile?.username || 'User',
            friendPublicId: currentUserProfile?.publicId || '',
            lastMessage: text,
            timestamp: serverTimestamp(),
            unreadCount: 1
          };
          update(ref(db, `recentChats/${friendUid}/${currentUser.uid}`), recipientRecentPayload).catch(() => {});

        } catch (err) {
          console.warn("Write to Firebase failed, falling back to pending:", err);
          messageObj.status = 'pending';
          await idbSavePending(messageObj);
          const row = document.getElementById(clientMessageId);
          if (row) updateMessageStatusBadge(row, 'pending');
        }
      }
    }

    /* =====================================================================
       OFFLINE QUEUE SYNCHRONIZATION
       ===================================================================== */
    async function syncPendingMessages() {
      if (isSynchronizing || !navigator.onLine || !currentUser || !conversationId) return;

      const pendingMessages = await idbGetPendingForConversation(conversationId);
      if (pendingMessages.length === 0) return;

      isSynchronizing = true;
      statusStrip.className = 'status-strip show syncing';
      statusStripText.textContent = `Connected. Synchronizing ${pendingMessages.length} pending message(s)...`;
      connectionChip.className = 'network-chip syncing';
      connectionChipText.textContent = 'Syncing';

      try {
        for (const msg of pendingMessages) {
          const msgRef = ref(db, `conversations/${conversationId}/messages/${msg.clientMessageId}`);
          
          await set(msgRef, {
            clientMessageId: msg.clientMessageId,
            conversationId: msg.conversationId,
            senderUid: msg.senderUid,
            receiverUid: msg.receiverUid,
            text: msg.text,
            createdAt: serverTimestamp(),
            status: 'sent'
          });

          // Remove from local pending queue
          await idbRemovePending(msg.clientMessageId);

          // Update cached message status
          msg.status = 'sent';
          await idbSaveMessage(msg);

          const row = document.getElementById(msg.clientMessageId);
          if (row) updateMessageStatusBadge(row, 'sent');
        }

        // Update Recent Conversations Preview with newest message
        const lastSynced = pendingMessages[pendingMessages.length - 1];
        if (lastSynced) {
          update(ref(db, `recentChats/${currentUser.uid}/${friendUid}`), {
            friendUid: friendUid,
            friendUsername: friendProfile?.username || 'Friend',
            lastMessage: lastSynced.text,
            timestamp: serverTimestamp()
          }).catch(() => {});
        }

      } catch (err) {
        console.error("Pending sync error:", err);
      } finally {
        isSynchronizing = false;
        connectionChip.className = 'network-chip online';
        connectionChipText.textContent = 'Online';
        statusStrip.classList.remove('show');
      }
    }

    /* =====================================================================
       OPTIONS DRAWER ACTIONS
       ==================================================================== */
    btnOpenOptions.addEventListener('click', () => {
      optionsDrawer.classList.add('show');
    });

    btnCloseDrawer.addEventListener('click', () => {
      optionsDrawer.classList.remove('show');
    });

    optionsDrawer.addEventListener('click', (e) => {
      if (e.target === optionsDrawer) {
        optionsDrawer.classList.remove('show');
      }
    });

    btnCopyFriendId.addEventListener('click', async () => {
      const pubId = friendPublicId.textContent.trim();
      optionsDrawer.classList.remove('show');
      if (!pubId || pubId === 'u_------') return;

      try {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(pubId);
        } else {
          const ta = document.createElement('textarea');
          ta.value = pubId;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        alert("Friend's Public User ID copied to clipboard!");
      } catch {
        alert("Failed to copy ID.");
      }
    });

    btnSyncNow.addEventListener('click', () => {
      optionsDrawer.classList.remove('show');
      if (!navigator.onLine) {
        alert("Internet connection required to synchronize pending messages.");
        return;
      }
      syncPendingMessages();
    });

  </script>
</body>
</html>
